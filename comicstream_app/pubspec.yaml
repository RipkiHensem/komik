name: comicstream_app
description: "ComicStream — Aplikasi Baca Komik/Manhwa Mobile"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Network & Backend
  supabase_flutter: ^2.5.4
  dio: ^5.7.0

  # Image caching
  cached_network_image: ^3.4.1

  # Local storage
  flutter_secure_storage: ^9.2.4
  hive_flutter: ^1.1.0

  # Typography
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  path_provider_foundation: 2.4.0

flutter:
  uses-material-design: true
