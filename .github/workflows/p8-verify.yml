name: P8 Flutter verification

on:
  pull_request:
  push:
    branches: [main, codex/p8-verification]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: comicstream_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check tracked files for private keys
        working-directory: .
        run: python tools/check_public_repo.py
      - name: Analyze source and tests
        run: dart analyze lib test
      - name: Run all unit tests
        run: flutter test --no-pub
      - name: Build Android demo APK
        run: flutter build apk --debug --no-pub
      - name: Upload demo APK
        uses: actions/upload-artifact@v4
        with:
          name: yomu-debug-apk
          path: comicstream_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
